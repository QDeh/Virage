spring:
  application:
    name: virage-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}

virage:
  cors:
    allowed-origins: ${VIRAGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  n8n:
    profile-analysis-url: ${N8N_PROFILE_ANALYSIS_URL:https://n8n.hackeuse.fr/webhook-test/virage/profile-analysis}
    job-matching-url: ${N8N_JOB_MATCHING_URL:https://n8n.hackeuse.fr/webhook-test/virage/job-matching}
    roadmap-url: ${N8N_ROADMAP_URL:https://n8n.hackeuse.fr/webhook-test/virage/roadmap}
    timeout-seconds: ${N8N_TIMEOUT_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
